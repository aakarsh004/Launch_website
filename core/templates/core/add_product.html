<!-- core/templates/core/add_product.html -->
{% extends 'core/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Add Product{% endblock %}

{% block content %}
<div class="container py-5">
    <h3>{% if product %}Edit{% else %}Add{% endif %} Product</h3>
    <form method="post" enctype="multipart/form-data" class="mt-4">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-pink">Save Product</button>
        <a href="{% url 'core:admin_dashboard' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
